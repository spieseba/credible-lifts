name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format github

      - name: Test
        run: uv run pytest