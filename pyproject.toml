[project]
name = "credible-lifts"        
version = "0.1.0"
description = "Forecasting Olympic weightlifting totals with credible intervals"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "pandas>=3.0.5",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
